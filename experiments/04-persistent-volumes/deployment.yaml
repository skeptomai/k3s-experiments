apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: pv-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      containers:
        - name: writer
          image: docker.io/library/busybox:stable
          command: ["/bin/sh", "-c"]
          args:
            - echo "$(date) — started as $POD_NAME" >> /data/log.txt && sleep infinity
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-pvc
