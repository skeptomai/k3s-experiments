# RSA 2048 private key — required for compatibility with CirrOS's Dropbear v2018.76,
# which doesn't interoperate with modern OpenSSH's ed25519 auth path.
#
# The secret is not stored here (contains a private key). Create it with:
#   kubectl create secret generic vm-ssh-key --from-file=id_rsa=<path-to-private-key>
#
# This keypair is for experiment/demo use only — not a production secret.
apiVersion: v1
kind: Secret
metadata:
  name: vm-ssh-key
  namespace: default
type: Opaque
# data.id_rsa: populate via kubectl create secret (see above)
