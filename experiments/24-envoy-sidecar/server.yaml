apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-server
  namespace: sidecar-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-server
  template:
    metadata:
      labels:
        app: sidecar-server
    spec:
      serviceAccountName: sidecar-server-sa
      initContainers:
        - name: wait-for-spire
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c"]
          args:
            - until [ -S /run/spire/sockets/agent.sock ]; do echo "waiting for SPIRE socket..."; sleep 2; done; echo "SPIRE socket ready."
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      containers:
        # The application — plain HTTP on the pod loopback. It is unaware of TLS.
        - name: app
          image: docker.io/hashicorp/http-echo:0.2.3
          args: ["-text=Hello from the app! (plain HTTP over localhost; sidecar does mTLS)", "-listen=127.0.0.1:8080"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
        # The Envoy sidecar — terminates mTLS on :9443, forwards to 127.0.0.1:8080.
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.32.0
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--service-node", "sidecar-server", "--service-cluster", "sidecar-demo"]
          ports:
            - containerPort: 9443
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: envoy-config
          configMap:
            name: sidecar-server-config
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-server-svc
  namespace: sidecar-demo
spec:
  selector:
    app: sidecar-server
  ports:
    - port: 9443
      targetPort: 9443
