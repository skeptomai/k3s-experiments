apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-server-config
  namespace: sidecar-demo
data:
  # Server sidecar: terminates mTLS on :9443, forwards to the co-located app
  # over the pod loopback (127.0.0.1:8080). The localhost hop is what requires
  # Pelagos #331 (pod loopback UP).
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
        - name: inbound
          address:
            socket_address: {address: 0.0.0.0, port_value: 9443}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: inbound
                    route_config:
                      virtual_hosts:
                        - name: local_app
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route: {cluster: local_app}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    tls_certificate_sds_secret_configs:
                      - name: "spiffe://ipc.local/sidecar-server"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc: {cluster_name: spire_agent}
                    combined_validation_context:
                      default_validation_context:
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher: {prefix: "spiffe://ipc.local/"}
                      validation_context_sds_secret_config:
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc: {cluster_name: spire_agent}

      clusters:
        - name: local_app
          connect_timeout: 2s
          type: STATIC
          load_assignment:
            cluster_name: local_app
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: 127.0.0.1, port_value: 8080}

        - name: spire_agent
          connect_timeout: 1s
          type: STATIC
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: {path: /run/spire/sockets/agent.sock}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-client-config
  namespace: sidecar-demo
data:
  # Client sidecar: the co-located app sends plain HTTP to 127.0.0.1:15001
  # (the loopback hop, requires Pelagos #331); the sidecar originates mTLS to
  # the server Service.
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
        - name: outbound
          address:
            socket_address: {address: 127.0.0.1, port_value: 15001}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: outbound
                    route_config:
                      virtual_hosts:
                        - name: sidecar_server
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route: {cluster: sidecar_server}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: sidecar_server
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: sidecar_server
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: sidecar-server-svc, port_value: 9443}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "spiffe://ipc.local/sidecar-client"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc: {cluster_name: spire_agent}
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher: {exact: "spiffe://ipc.local/sidecar-server"}
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc: {cluster_name: spire_agent}

        - name: spire_agent
          connect_timeout: 1s
          type: STATIC
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: {path: /run/spire/sockets/agent.sock}
