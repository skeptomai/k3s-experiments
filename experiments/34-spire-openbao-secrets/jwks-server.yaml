# Serves the spire-jwks ConfigMap (written by registration-and-jwks-job.yaml) over
# plain HTTP so OpenBao's jwt auth method can fetch it via jwks_url. Mirrors the
# existing busybox-httpd pattern already used elsewhere in this cluster to serve a
# small SPIRE-derived artifact to another component (the spire-bundle-signing
# service on the SPIRE server pod) -- same idea, same minimal footprint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-jwks-server
  namespace: spire-openbao-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-jwks-server
  template:
    metadata:
      labels:
        app: spire-jwks-server
    spec:
      containers:
        - name: httpd
          image: busybox:1.36
          command: ["busybox", "httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: jwks
              mountPath: /www
              readOnly: true
      volumes:
        - name: jwks
          configMap:
            name: spire-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: spire-jwks-svc
  namespace: spire-openbao-demo
spec:
  selector:
    app: spire-jwks-server
  ports:
    - port: 8080
      targetPort: 8080
