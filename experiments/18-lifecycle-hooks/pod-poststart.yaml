apiVersion: v1
kind: Pod
metadata:
  name: poststart-demo
  namespace: hooks-demo
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: docker.io/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 300"]
      lifecycle:
        postStart:
          exec:
            command: ["sh", "-c", "echo poststart-ran > /tmp/hook-proof"]
