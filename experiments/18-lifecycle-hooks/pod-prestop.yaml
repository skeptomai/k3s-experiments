apiVersion: v1
kind: Pod
metadata:
  name: prestop-demo
  namespace: hooks-demo
spec:
  nodeName: ipc4
  restartPolicy: Never
  terminationGracePeriodSeconds: 15
  containers:
    - name: main
      image: docker.io/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 300"]
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "echo prestop-ran > /evidence/prestop-proof"]
      volumeMounts:
        - name: evidence
          mountPath: /evidence
  volumes:
    - name: evidence
      hostPath:
        path: /tmp/hooks-demo-prestop
        type: DirectoryOrCreate
