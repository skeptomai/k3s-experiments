apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: envoy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: app
          image: docker.io/hashicorp/http-echo:0.2.3
          args: ["-text=Hello from backend! (plain HTTP; mTLS handled by Envoy proxies)", "-listen=:8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: envoy-demo
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
