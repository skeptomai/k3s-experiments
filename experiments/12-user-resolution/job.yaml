apiVersion: batch/v1
kind: Job
metadata:
  name: user-resolution-test
  namespace: user-demo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: id-check
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          # curlimages/curl OCI config has User: "curl_user" (string, not numeric).
          # Pelagos must resolve "curl_user" -> UID 100 via the IMAGE's /etc/passwd,
          # not the host's. curl_user does not exist on Ubuntu 24.04 hosts.
          command: ["sh", "-c", "id"]
