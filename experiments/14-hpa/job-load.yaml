apiVersion: batch/v1
kind: Job
metadata:
  name: load-gen
  namespace: hpa-demo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load-gen
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 3000); do
                wget -q -O- http://hpa-demo-svc > /dev/null 2>&1 &
                [ $((i % 5)) -eq 0 ] && wait
              done
              wait
