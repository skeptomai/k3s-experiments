apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-registrar
  namespace: spire
---
# Allows the registration job to kubectl exec into the spire-server pod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-registrar
  namespace: spire
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-registrar
  namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-registrar
subjects:
  - kind: ServiceAccount
    name: spire-registrar
    namespace: spire
