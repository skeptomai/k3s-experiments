apiVersion: batch/v1
kind: Job
metadata:
  name: spire-register-demo
  namespace: spire
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: spire-registrar
      restartPolicy: OnFailure
      containers:
        - name: register
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              SERVER="pod/spire-server-0"
              NS="-n spire"
              BIN="/opt/spire/bin/spire-server entry create"

              echo "=== Creating node alias for all k8s_psat agents in cluster ipc ==="
              # This alias means: any attested agent in our cluster can issue SVIDs
              # to workloads whose entries have this alias as their parentID.
              # Without this, you'd need a separate entry per node UID.
              kubectl exec $NS $SERVER -- $BIN \
                -spiffeID spiffe://ipc.local/k8s-node \
                -parentID spiffe://ipc.local/spire/server \
                -selector k8s_psat:cluster:ipc \
                -node \
              && echo "Node alias created." || echo "Node alias may already exist, continuing."

              echo ""
              echo "=== Creating workload entry for spire-demo/demo-sa (k8s selectors) ==="
              # Ideal entry: matched by k8s WorkloadAttestor (ns + serviceaccount).
              # NOTE: Pelagos uses 32-char container IDs; SPIRE's containerinfo regex
              # requires 64-char IDs, so this entry never matches on this cluster.
              # Kept for reference — see README Phase 2 for details.
              kubectl exec $NS $SERVER -- $BIN \
                -spiffeID spiffe://ipc.local/demo-app \
                -parentID spiffe://ipc.local/k8s-node \
                -selector k8s:ns:spire-demo \
                -selector k8s:sa:demo-sa \
              && echo "Workload entry (k8s) created." || echo "Workload entry (k8s) may already exist."

              echo ""
              echo "=== Creating workload entry for spire-demo/demo-sa (unix selectors) ==="
              # Workaround entry: matched by unix WorkloadAttestor (uid=0).
              # Used because Pelagos 32-char container IDs are incompatible with
              # SPIRE 1.9.6's hardcoded 64-char container ID regex in extract.go.
              kubectl exec $NS $SERVER -- $BIN \
                -spiffeID spiffe://ipc.local/demo-app \
                -parentID spiffe://ipc.local/k8s-node \
                -selector unix:uid:0 \
              && echo "Workload entry (unix) created." || echo "Workload entry (unix) may already exist."

              echo ""
              echo "=== Current registration entries ==="
              kubectl exec $NS pod/spire-server-0 -- /opt/spire/bin/spire-server entry show
