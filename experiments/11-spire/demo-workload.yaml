apiVersion: v1
kind: Pod
metadata:
  name: demo-workload
  namespace: spire-demo
spec:
  serviceAccountName: demo-sa
  initContainers:
    # Wait for the agent socket to exist on this node.
    - name: init-socket
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          until [ -S /run/spire/sockets/agent.sock ]; do
            echo "Waiting for SPIRE agent socket..."
            sleep 2
          done
          echo "Socket ready."
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true

    # Fetch the X.509 SVID from the Workload API and write it to a shared volume.
    # The spire-agent image is distroless (no shell), so we invoke the binary directly.
    - name: fetch-svid
      image: ghcr.io/spiffe/spire-agent:1.9.6
      command:
        - /opt/spire/bin/spire-agent
        - api
        - fetch
        - x509
        - -socketPath
        - /run/spire/sockets/agent.sock
        - -write
        - /tmp/svids
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        - name: svids
          mountPath: /tmp/svids

  containers:
    - name: demo
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args:
        - |
          echo "=== Fetching X.509 SVID from Workload API ==="
          ls /tmp/svids/

          echo ""
          echo "=== SPIFFE ID from SVID ==="
          openssl x509 -in /tmp/svids/svid.0.pem -noout -text \
            | grep -A1 "Subject Alternative Name" | grep URI

          echo ""
          echo "=== Certificate details ==="
          openssl x509 -in /tmp/svids/svid.0.pem -noout \
            -subject -issuer -dates

          echo ""
          echo "=== Bundle (trust domain CA) ==="
          openssl x509 -in /tmp/svids/bundle.0.pem -noout \
            -subject -dates
      volumeMounts:
        - name: svids
          mountPath: /tmp/svids
          readOnly: true

  volumes:
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/sockets
        type: Directory
    - name: svids
      emptyDir: {}

  restartPolicy: Never
