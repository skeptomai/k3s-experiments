apiVersion: v1
kind: Pod
metadata:
  name: demo-workload
  namespace: spire-demo
spec:
  serviceAccountName: demo-sa
  initContainers:
    # Wait for the agent socket on this node.
    - name: init-socket
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          until [ -S /run/spire/sockets/agent.sock ]; do
            echo "Waiting for SPIRE agent socket..."
            sleep 2
          done
          echo "Socket ready."
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true

  containers:
    # Main container: ubuntu with curl + openssl. Downloads the spire-agent
    # binary at startup, fetches the SVID via the Workload API, then inspects
    # it with openssl. Running as the main container (not an init container)
    # avoids the race where the kubelet hasn't yet registered the container's
    # ID in initContainerStatuses before the SPIRE attestor queries it.
    - name: demo
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args:
        - |
          set -e
          echo "=== Installing tools ==="
          apt-get update -qq && apt-get install -y --no-install-recommends curl openssl ca-certificates 2>/dev/null | tail -3

          echo ""
          echo "=== Downloading spire-agent binary ==="
          curl -sL https://github.com/spiffe/spire/releases/download/v1.9.6/spire-1.9.6-linux-amd64-musl.tar.gz \
            | tar -xz --strip-components=2 -C /usr/local/bin spire-1.9.6/bin/spire-agent
          chmod +x /usr/local/bin/spire-agent

          echo ""
          echo "=== Fetching X.509 SVID from Workload API ==="
          mkdir -p /tmp/svids
          # Retry loop: the kubelet may not have registered this container's ID in
          # pod status before the entrypoint runs; SPIRE can't attest us until it has.
          for i in $(seq 1 15); do
            if spire-agent api fetch x509 \
                -socketPath /run/spire/sockets/agent.sock \
                -write /tmp/svids 2>/tmp/spire-err; then
              break
            fi
            echo "Attempt $i failed: $(cat /tmp/spire-err) — retrying in 2s..."
            sleep 2
          done
          cat /tmp/spire-err 2>/dev/null | grep -v 'no identity' || true

          echo ""
          echo "=== SPIFFE ID from SVID ==="
          openssl x509 -in /tmp/svids/svid.0.pem -noout -text \
            | grep -A1 "Subject Alternative Name" | grep URI

          echo ""
          echo "=== Certificate details ==="
          openssl x509 -in /tmp/svids/svid.0.pem -noout \
            -subject -issuer -dates

          echo ""
          echo "=== Bundle (trust domain CA) ==="
          openssl x509 -in /tmp/svids/bundle.0.pem -noout \
            -subject -dates
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true

  volumes:
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/sockets
        type: Directory

  restartPolicy: Never
