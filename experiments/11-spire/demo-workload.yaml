apiVersion: v1
kind: Pod
metadata:
  name: demo-workload
  namespace: spire-demo
spec:
  serviceAccountName: demo-sa
  initContainers:
    # Wait for the agent socket to exist on this node.
    - name: init-socket
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          until [ -S /run/spire/sockets/agent.sock ]; do
            echo "Waiting for SPIRE agent socket..."
            sleep 2
          done
          echo "Socket ready."
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true

    # Copy the spire-agent binary (distroless image) into a shared emptyDir
    # so the main container can invoke it.
    - name: copy-spire-bin
      image: ghcr.io/spiffe/spire-agent:1.9.6
      command: ["cp", "/opt/spire/bin/spire-agent", "/spire-bin/spire-agent"]
      volumeMounts:
        - name: spire-bin
          mountPath: /spire-bin

  containers:
    # Main container: fetch SVID using the copied binary, then inspect with openssl.
    # Running as the main container (not an init container) avoids the race condition
    # where the kubelet may not have registered the container ID in initContainerStatuses
    # before the SPIRE workload attestor queries it.
    - name: demo
      image: ubuntu:22.04
      command: ["bash", "-c"]
      args:
        - |
          set -e
          echo "=== Fetching X.509 SVID from Workload API ==="
          /opt/spire/bin/spire-agent api fetch x509 \
            -socketPath /run/spire/sockets/agent.sock \
            -write /tmp/svids

          echo ""
          echo "=== SPIFFE ID from SVID ==="
          openssl x509 -in /tmp/svids/svid.0.pem -noout -text \
            | grep -A1 "Subject Alternative Name" | grep URI

          echo ""
          echo "=== Certificate details ==="
          openssl x509 -in /tmp/svids/svid.0.pem -noout \
            -subject -issuer -dates

          echo ""
          echo "=== Bundle (trust domain CA) ==="
          openssl x509 -in /tmp/svids/bundle.0.pem -noout \
            -subject -dates
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        - name: spire-bin
          mountPath: /opt/spire/bin
          readOnly: true
        - name: svids
          mountPath: /tmp/svids

  volumes:
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/sockets
        type: Directory
    - name: spire-bin
      emptyDir: {}
    - name: svids
      emptyDir: {}

  restartPolicy: Never
