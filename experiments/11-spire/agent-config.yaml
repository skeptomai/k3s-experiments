apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      trust_domain = "ipc.local"
      server_address = "spire-server"
      server_port = "8081"
      # Bundle file is mounted from the spire-bundle ConfigMap; the server's
      # k8s_bundle Notifier writes bundle.crt into it after startup.
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      socket_path = "/run/spire/sockets/agent.sock"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "ipc"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          # Uses the kubelet /pods API to map PID→cgroup→container→pod.
          # skip_kubelet_verification bypasses the kubelet's serving cert check
          # (self-signed on k3s nodes).
          #
          # Pelagos uses 32-char hex container IDs (not the standard 64-char Docker
          # format). The legacy locator only matches 64-char IDs, so we use the new
          # locator with an explicit matcher for Pelagos cgroup paths:
          #   /kubepods/<qos>/pod<uid>/<32-char-id>
          node_name_env = "MY_NODE_NAME"
          skip_kubelet_verification = true
          use_new_container_locator = true
          container_id_cgroup_matchers = [
            "/kubepods/[^/]+/[^/]+/([0-9a-f]{32})$",
          ]
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
