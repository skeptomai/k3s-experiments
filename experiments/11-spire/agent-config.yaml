apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      trust_domain = "ipc.local"
      server_address = "spire-server"
      server_port = "8081"
      # Bundle file is mounted from the spire-bundle ConfigMap; the server's
      # k8s_bundle Notifier writes bundle.crt into it after startup.
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "ipc"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          # Uses the kubelet /pods API to map PID→cgroup→container→pod.
          # skip_kubelet_verification bypasses the kubelet's serving cert check
          # (self-signed on k3s nodes). The cgroup path format is Pelagos-dependent —
          # if workload attestation fails, check /proc/<pid>/cgroup inside a pod
          # and compare against SPIRE's container_id_cgroup_matchers patterns.
          node_name_env = "MY_NODE_NAME"
          skip_kubelet_verification = true
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
