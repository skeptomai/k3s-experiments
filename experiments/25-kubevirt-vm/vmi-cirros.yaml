apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: cirros-test
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: ipc8
  domain:
    cpu:
      cores: 1
    memory:
      guest: 256Mi
    devices:
      disks:
        - name: containerdisk
          disk:
            bus: virtio
      interfaces:
        - name: default
          masquerade: {}
  networks:
    - name: default
      pod: {}
  volumes:
    - name: containerdisk
      containerDisk:
        image: quay.io/kubevirt/cirros-container-disk-demo:v1.8.4
