apiVersion: apps/v1
kind: Deployment
metadata:
  name: stamp-controller
  namespace: custom-controller-demo
  labels:
    app: stamp-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stamp-controller
  template:
    metadata:
      labels:
        app: stamp-controller
    spec:
      serviceAccountName: stamp-controller
      containers:
        - name: stamp-controller
          image: 192.168.89.2:5004/stamp-controller:latest
          imagePullPolicy: Always
          env:
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
