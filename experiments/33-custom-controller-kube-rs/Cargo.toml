[package]
name = "stamp-controller"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stamp-controller"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.33"
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.2.0", features = ["derive", "runtime", "client"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
