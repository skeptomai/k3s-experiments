apiVersion: batch/v1
kind: Job
metadata:
  name: verify
  namespace: stateful-demo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for pod in web-0 web-1 web-2; do
                result=$(wget -qO- http://$pod.web.stateful-demo.svc.cluster.local 2>/dev/null | tr -d '[:space:]')
                if [ "$result" != "$pod" ]; then
                  echo "FAIL: $pod returned '$result', expected '$pod'"
                  exit 1
                fi
                echo "OK: $pod serves its own identity"
              done
              echo "All 3 pods have distinct stable identities"
