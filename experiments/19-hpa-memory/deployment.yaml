apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-mem-demo
  namespace: hpa-mem-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-mem-demo
  template:
    metadata:
      labels:
        app: hpa-mem-demo
    spec:
      containers:
        - name: mem-holder
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          # Allocate and hold ~30MB — intentionally above the HPA averageValue
          # target of 20Mi so HPA scales up without needing a separate load generator.
          command: ["sh", "-c", "mem=$(dd if=/dev/urandom bs=1M count=30 2>/dev/null); sleep 3600"]
          resources:
            requests:
              memory: "16Mi"
            limits:
              memory: "64Mi"
