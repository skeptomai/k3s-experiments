apiVersion: v1
kind: Pod
metadata:
  name: oomkill-demo
  namespace: limits-demo
spec:
  containers:
    - name: stress
      image: docker.io/library/busybox:1.36
      resources:
        requests:
          memory: "64Mi"
        limits:
          memory: "64Mi"
      command: ["sh", "-c"]
      # yes generates non-null bytes so bash command substitution holds them in RAM;
      # 200MB exceeds the 64Mi limit, triggering OOMKill (exit 137).
      args: ["x=$(yes A | head -c 209715200); echo ${#x}"]
  restartPolicy: Never
