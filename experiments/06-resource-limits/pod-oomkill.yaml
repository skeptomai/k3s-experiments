apiVersion: v1
kind: Pod
metadata:
  name: oomkill-demo
  namespace: limits-demo
spec:
  containers:
    - name: stress
      image: polinux/stress
      resources:
        requests:
          memory: "64Mi"
        limits:
          memory: "64Mi"
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "0"]
  restartPolicy: Never
