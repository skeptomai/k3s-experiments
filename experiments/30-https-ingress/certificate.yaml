apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-tls
  namespace: https-demo
spec:
  secretName: hello-tls
  duration: 8760h    # 1y
  renewBefore: 720h  # renew 30d before expiry
  issuerRef:
    name: vault-pki-issuer
    kind: ClusterIssuer
  dnsNames:
    - hello.home.skeptomai.com
