apiVersion: batch/v1
kind: Job
metadata:
  name: lb-verify
  namespace: lb-demo
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 30); do wget -qO- http://lb-demo-svc; done
