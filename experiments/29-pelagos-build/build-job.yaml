apiVersion: batch/v1
kind: Job
metadata:
  name: pelagos-build-v0-65-73
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ipc7
      securityContext:
        runAsUser: 0
      containers:
        - name: build
          image: 192.168.89.2:5004/pelagos-builder:rust-protoc-34.1
          env:
            - name: GIT_REF
              value: "v0.65.73"
            - name: CARGO_HOME
              value: /cache/cargo
            - name: CARGO_TARGET_DIR
              value: /cache/target
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              protoc --version
              REPO=/cache/repo
              if [ -d "$REPO/.git" ]; then
                git -C "$REPO" fetch --all -q
              else
                git clone -q https://github.com/pelagos-containers/pelagos.git "$REPO"
              fi
              cd "$REPO"
              git checkout -q "$GIT_REF"
              if git rev-parse --verify -q "origin/$GIT_REF" >/dev/null 2>&1; then
                git reset --hard -q "origin/$GIT_REF"
              fi
              echo "==> building $(git rev-parse --short HEAD) ($GIT_REF)"
              cargo build --release -p pelagos -p pelagos-cri -p pelagos-dockerd
              echo "==> unit tests (cargo test --lib)"
              cargo test --release --lib -p pelagos -p pelagos-cri
              install -m0755 "$CARGO_TARGET_DIR/release/pelagos" \
                             "$CARGO_TARGET_DIR/release/pelagos-cri" \
                             "$CARGO_TARGET_DIR/release/pelagos-dockerd" /out/
              echo "==> done: /out/pelagos /out/pelagos-cri"
              ls -lh /out/
              echo "==> compiling integration test binary (--no-run, SSH execution on ipc7)"
              cargo test --release --test integration_tests --no-run
              echo "==> running integration tests on ipc7 via SSH"
              ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /root/.ssh/id_rsa \
                cb@192.168.88.63 "sudo bash -s" << 'REMOTE_SCRIPT'
              set -euo pipefail
              CACHE=/srv/pelagos-build/cache
              ln -sfn "$CACHE" /cache
              ln -sfn /srv/pelagos-build/alpine-rootfs "$CACHE/repo/alpine-rootfs"
              TESTBIN=$(ls "$CACHE/target/release/deps/integration_tests-"* 2>/dev/null | grep -v '\.d$' | tail -1)
              [ -n "$TESTBIN" ] || { echo "ERROR: no integration_tests binary in $CACHE/target/release/deps/" >&2; exit 1; }
              echo "==> $(basename "$TESTBIN") on $(hostname) (direct, no pod wrapper)"
              export PATH=/srv/pelagos-build/out:$PATH
              cd "$CACHE/repo"
              # Some test modules use env!("CARGO_MANIFEST_DIR") + "/target/debug/<bin>"
              # (hardcoded debug path even when built --release). Symlink to satisfy them.
              mkdir -p "$CACHE/repo/target/debug"
              ln -sfn "$CACHE/target/release/pelagos"         "$CACHE/repo/target/debug/pelagos"
              ln -sfn "$CACHE/target/release/pelagos-cri"     "$CACHE/repo/target/debug/pelagos-cri"
              ln -sfn "$CACHE/target/release/pelagos-dockerd" "$CACHE/repo/target/debug/pelagos-dockerd"
              exec "$TESTBIN" --test-threads=1
              REMOTE_SCRIPT
          resources:
            requests:
              cpu: "8"
              memory: "8Gi"
            limits:
              cpu: "12"
              memory: "16Gi"
          volumeMounts:
            - { name: cache,   mountPath: /cache }
            - { name: output,  mountPath: /out }
            - name: ssh-key
              mountPath: /root/.ssh/id_rsa
              subPath: id_rsa
              readOnly: true
      volumes:
        - name: cache
          hostPath: { path: /srv/pelagos-build/cache, type: DirectoryOrCreate }
        - name: output
          hostPath: { path: /srv/pelagos-build/out, type: DirectoryOrCreate }
        - name: ssh-key
          secret:
            secretName: pelagos-build-ssh-key
            defaultMode: 0600
