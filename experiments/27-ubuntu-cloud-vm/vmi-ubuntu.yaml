apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: ubuntu-cloud
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: ipc8
  domain:
    cpu:
      cores: 2
    memory:
      guest: 1Gi
    devices:
      disks:
        - name: rootdisk
          disk:
            bus: virtio
        - name: cloudinitdisk
          disk:
            bus: virtio
      interfaces:
        - name: default
          masquerade: {}
  networks:
    - name: default
      pod: {}
  volumes:
    - name: rootdisk
      containerDisk:
        image: 192.168.89.2:5004/ubuntu/ubuntu-cloud-disk:24.04
    - name: cloudinitdisk
      cloudInitNoCloud:
        userData: |
          #cloud-config
          ssh_authorized_keys:
            - ssh-rsa  vm-jump-experiment
