apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - allow-external-scraping.yaml
  - kustomize-controller-metrics-nodeport.yaml
patches:
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-scraping
        namespace: flux-system
    target:
      kind: NetworkPolicy
      name: allow-scraping
