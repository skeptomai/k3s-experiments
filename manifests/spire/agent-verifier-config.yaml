---
# ConfigMap for spire-server-attestor-tpm-verifier
# Runs as a sidecar in every spire-agent pod.
# Fetches the signed trust bundle JWT from spire-bundle-signing service,
# verifies the signature against /etc/spire/server-bundle-signing.pub
# (written to each node out-of-band by provision-tpm-devid.sh),
# and serves the verified trust bundle via Unix socket to the SPIRE agent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-verifier-config
  namespace: spire
data:
  verifier.conf: |
    keydir: /etc/spire
    socket: /var/run/spire/server-attestor-tpm/verifier.sock
    keyset:
      main:
        url: http://spire-bundle-signing.spire.svc.cluster.local/spiffetrustbundle.token
        chain:
          - server-bundle-signing.pub
