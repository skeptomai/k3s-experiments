apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      trust_domain = "ipc.local"
      data_dir = "/run/spire/data"
      log_level = "INFO"
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      NodeAttestor "tpm_devid" {
        plugin_data {
          devid_ca_path = "/run/spire/tpm-ca/devid-ca.pem"
          endorsement_ca_path = "/run/spire/tpm-ca/endorsement-ca-bundle.pem"
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }

      BundlePublisher "tpm-sign" {
        plugin_cmd = "/usr/local/bin/spire-server-attestor-tpm-sign"
        plugin_data {
          socket    = "/var/run/spire/server-attestor-tpm/signer-unix.sock"
          frequency = "5m"
        }
      }

      Notifier "k8sbundle" {
        plugin_data {
          namespace = "spire"
          config_map = "spire-bundle"
          config_map_key = "bundle.crt"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
# Agents read this to bootstrap trust with the server CA.
# The server's k8s_bundle notifier keeps it up to date.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire
