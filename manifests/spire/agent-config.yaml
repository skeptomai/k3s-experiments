apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      trust_domain = "ipc.local"
      server_address = "spire-server"
      server_port = "8081"
      # Bundle file is mounted from the spire-bundle ConfigMap; the server's
      # k8s_bundle Notifier writes bundle.crt into it after startup.
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      socket_path = "/run/spire/sockets/agent.sock"
    }

    plugins {
      NodeAttestor "tpm_devid" {
        plugin_data {
          devid_cert_path = "/etc/spire/devid.crt"
          devid_priv_path = "/etc/spire/devid.priv"
          devid_pub_path  = "/etc/spire/devid.pub"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          node_name_env = "MY_NODE_NAME"
          skip_kubelet_verification = true
          use_new_container_locator = true
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
