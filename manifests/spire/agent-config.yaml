apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      trust_domain = "ipc.local"
      server_address = "spire-server"
      server_port = "8081"
      # Trust bundle is obtained from the verifier sidecar, which fetches it
      # from the signer-http service and verifies the TPM signature before
      # delivering it. This replaces the unauthenticated ConfigMap path.
      trust_bundle_unix_socket_path = "/var/run/spire/server-attestor-tpm/verifier.sock"
      socket_path = "/run/spire/sockets/agent.sock"
    }

    plugins {
      NodeAttestor "tpm_devid" {
        plugin_data {
          devid_cert_path  = "/etc/spire/devid.crt"
          devid_priv_path  = "/etc/spire/devid.priv"
          devid_pub_path   = "/etc/spire/devid.pub"
          tpm_device_path  = "/dev/tpmrm0"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          node_name_env = "MY_NODE_NAME"
          skip_kubelet_verification = true
          use_new_container_locator = true
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
