apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostPID: true  # required: workload attestor resolves PIDs to pods
      tolerations:
        - operator: Exists
      initContainers:
        # Fetches the signed trust bundle JWT from the signer-http service,
        # verifies the RS256 signature against the server's TPM public key
        # (written out-of-band to /etc/spire/ by provision-tpm-devid.sh),
        # and writes the verified CA cert to a shared emptyDir volume.
        # Replaces the unauthenticated spire-bundle ConfigMap bootstrap path.
        # Exits 1 and blocks agent startup if the signature is invalid.
        - name: verify-bundle
          image: docker.io/library/python:3.12
          command: ["python3", "/scripts/verify-bundle.py"]
          volumeMounts:
            - name: verifier-script
              mountPath: /scripts
              readOnly: true
            - name: spire-devid
              mountPath: /etc/spire
              readOnly: true
            - name: verified-bundle
              mountPath: /run/spire/verified-bundle
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.9.6
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: verified-bundle
              mountPath: /run/spire/verified-bundle
              readOnly: true
            - name: spire-agent-socket-dir
              mountPath: /run/spire/sockets
            - name: spire-devid
              mountPath: /etc/spire
              readOnly: true
            - name: tpm-device
              mountPath: /dev/tpmrm0
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: spire-config
          configMap:
            name: spire-agent
        - name: verifier-script
          configMap:
            name: spire-bundle-verifier-script
        - name: spire-agent-socket-dir
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-devid
          hostPath:
            path: /etc/spire
            type: Directory
        - name: tpm-device
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
        - name: verified-bundle
          emptyDir: {}
