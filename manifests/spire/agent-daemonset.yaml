apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostPID: true  # required: workload attestor resolves PIDs to pods
      # Run on EVERY node, including tainted ones (e.g. the control-plane taint on
      # ipc1) — a per-node identity agent should be universal. Blanket `Exists`
      # tolerates any taint, matching the node-exporter DaemonSet pattern.
      tolerations:
        - operator: Exists
      initContainers:
        # Wait until the server has written bundle.crt into the spire-bundle ConfigMap.
        # Kubernetes syncs ConfigMap volume mounts when the ConfigMap changes; the file
        # appears once the server's k8s_bundle Notifier has run.
        - name: init-bundle
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              until [ -s /run/spire/bundle/bundle.crt ]; do
                echo "Waiting for spire-bundle..."
                sleep 5
              done
              echo "Bundle ready."
          volumeMounts:
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.9.6
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: spire-agent-socket-dir
              mountPath: /run/spire/sockets
            - name: spire-token
              mountPath: /var/run/secrets/tokens
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: spire-config
          configMap:
            name: spire-agent
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: spire-agent-socket-dir
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
