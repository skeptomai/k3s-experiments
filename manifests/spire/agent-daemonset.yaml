apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostPID: true  # required: workload attestor resolves PIDs to pods
      tolerations:
        - operator: Exists
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.9.6
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-agent-socket-dir
              mountPath: /run/spire/sockets
            - name: spire-devid
              mountPath: /etc/spire
              readOnly: true
            - name: tpm-device
              mountPath: /dev/tpmrm0
            - name: verifier-socket-dir
              mountPath: /var/run/spire/server-attestor-tpm
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

        # Fetches the signed trust bundle JWT from the signer-http service,
        # verifies the TPM signature against /etc/spire/server-bundle-signing.pub
        # (written out-of-band by provision-tpm-devid.sh — not from Kubernetes),
        # and serves the verified bundle via Unix socket to the SPIRE agent.
        # If not ready when agent starts, agent restarts and finds it ready.
        - name: verifier
          image: docker.io/library/busybox:1.36
          command: ["/usr/local/bin/spire-server-attestor-tpm-verifier",
                    "/etc/spire-sat/verifier.conf"]
          volumeMounts:
            - name: verifier-binary
              mountPath: /usr/local/bin/spire-server-attestor-tpm-verifier
              readOnly: true
            - name: verifier-config
              mountPath: /etc/spire-sat
              readOnly: true
            - name: spire-devid
              mountPath: /etc/spire
              readOnly: true
            - name: verifier-socket-dir
              mountPath: /var/run/spire/server-attestor-tpm

      volumes:
        - name: spire-config
          configMap:
            name: spire-agent
        - name: verifier-config
          configMap:
            name: spire-verifier-config
        - name: spire-agent-socket-dir
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: spire-devid
          hostPath:
            path: /etc/spire
            type: Directory
        - name: tpm-device
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
        - name: verifier-socket-dir
          emptyDir: {}
        - name: verifier-binary
          hostPath:
            path: /usr/local/bin/spire-server-attestor-tpm-verifier
            type: File
