apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
  clusterIP: None  # headless — agents connect by DNS name
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
spec:
  selector:
    matchLabels:
      app: spire-server
  serviceName: spire-server
  replicas: 1
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.9.6
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - name: grpc
              containerPort: 8081
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-tpm-ca
              mountPath: /run/spire/tpm-ca
              readOnly: true
            - name: signer-socket-dir
              mountPath: /var/run/spire/server-attestor-tpm
            - name: sign-binary
              mountPath: /usr/local/bin/spire-server-attestor-tpm-sign
              readOnly: true
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

        # Signs trust bundles using the server's TPM key (handle 0x81008006).
        # Writes a signed JWT to /var/spire/signed-bundle/spiffetrustbundle.token.
        # The sign BundlePublisher plugin retries on the 5m frequency if not ready yet.
        - name: signer-unix
          image: docker.io/library/busybox:1.36
          command: ["/usr/local/bin/spire-server-attestor-tpm-signer-unix",
                    "/etc/spire-sat/signer-unix.conf"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: signer-unix-binary
              mountPath: /usr/local/bin/spire-server-attestor-tpm-signer-unix
              readOnly: true
            - name: signer-config
              mountPath: /etc/spire-sat
              readOnly: true
            - name: signer-socket-dir
              mountPath: /var/run/spire/server-attestor-tpm
            - name: signed-bundle-dir
              mountPath: /var/spire/signed-bundle
            - name: tpm-device
              mountPath: /dev/tpmrm0

        # Serves the signed bundle JWT over HTTP on port 8181.
        # busybox httpd is sufficient — this is a static one-file server.
        # NOTE: spire-server-attestor-tpm-signer-http is NOT used here. That binary
        # is a software-key alternative to signer-unix (it signs with a PEM RSA key),
        # not an HTTP frontend for it. For TPM-backed signing, use signer-unix + a
        # static file server (this container). signer-http would replace signer-unix,
        # defeating the purpose of hardware attestation.
        - name: bundle-http
          image: docker.io/library/busybox:1.36
          command: ["httpd", "-f", "-p", "8181", "-h", "/var/spire/signed-bundle"]
          ports:
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: signed-bundle-dir
              mountPath: /var/spire/signed-bundle
              readOnly: true

      volumes:
        - name: spire-config
          configMap:
            name: spire-server
        - name: spire-tpm-ca
          configMap:
            name: spire-tpm-ca
        - name: signer-config
          configMap:
            name: spire-signer-unix-config
        - name: signer-socket-dir
          emptyDir: {}
        - name: signed-bundle-dir
          emptyDir: {}
        - name: sign-binary
          hostPath:
            path: /usr/local/bin/spire-server-attestor-tpm-sign
            type: File
        - name: signer-unix-binary
          hostPath:
            path: /usr/local/bin/spire-server-attestor-tpm-signer-unix
            type: File
        - name: tpm-device
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs
        resources:
          requests:
            storage: 1Gi
