---
# ConfigMap for spire-server-attestor-tpm-signer-unix.
# Signs the SPIRE trust bundle using the server's TPM key (handle 0x81008006)
# and writes a signed JWT to /var/spire/signed-bundle/spiffetrustbundle.token.
# The bundle-http sidecar (busybox httpd) serves that file over HTTP — no config needed.
#
# NOTE: spire-server-attestor-tpm-signer-http is NOT used here and should not be.
# That binary is a software-key signing alternative to signer-unix (signs JWTs with a
# PEM RSA private key), not an HTTP frontend for it. Using signer-http would replace
# the TPM-backed signing with a software key, defeating the purpose of hardware attestation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-signer-unix-config
  namespace: spire
data:
  signer-unix.conf: |
    socket: /var/run/spire/server-attestor-tpm/signer-unix.sock
    tpm-address: 0x81008006
    duration: 10m
    dir: /var/spire/signed-bundle
---
# ClusterIP Service exposing the signed bundle over HTTP.
# The spire-server pod (ipc4) runs a busybox httpd sidecar serving /var/spire/signed-bundle.
# Agent verify-bundle init containers fetch:
# http://spire-bundle-signing.spire.svc.cluster.local/spiffetrustbundle.token
apiVersion: v1
kind: Service
metadata:
  name: spire-bundle-signing
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - name: http
      port: 80
      targetPort: 8181
  type: ClusterIP
