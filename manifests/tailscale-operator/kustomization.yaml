# Tailscale Kubernetes operator — publishes cluster Services to the tailnet
# (per-Service tagged devices, not subnet routing). First consumer: gruesome,
# exposed at gruesome.taildd208.ts.net (see manifests/gruesome/service.yaml).
#
# The `operator-oauth` Secret (client_id/client_secret) is intentionally NOT in
# this repo — created out-of-band (see helmrelease.yaml for the command).
# Requires helm-controller (flux-system). See orgfiles home-network/tailscale.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
