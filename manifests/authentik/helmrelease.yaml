apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  # Default 5m install timeout is too tight for this chart's real startup
  # sequence (Postgres init on NFS storage + system migrations + Django
  # migrations + gunicorn boot measured ~4-5min empirically) -- Helm gave
  # up and reported "install failed" right as the pods actually finished
  # coming up healthy. Give it real headroom.
  timeout: 10m
  chart:
    spec:
      chart: authentik
      # Was pinned to 2026.5.6 2026-08-18 after pelagos-containers/pelagos#533
      # (nested OCI index unsupported) blocked pulling 2026.8.0's image. Fixed
      # in Pelagos v0.65.92 and confirmed by directly re-pulling
      # ghcr.io/goauthentik/server:2026.8.0 (26/26 layers, clean) -- unpinned
      # to let Flux track latest again.
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    authentik:
      # Core config (secret_key, postgresql password) AND the
      # AUTHENTIK_BOOTSTRAP_* first-run vars all live in one out-of-band
      # Secret, created once via kubectl, deliberately not in git (same
      # pattern as manifests/tailscale-operator's operator-oauth Secret,
      # manifests/open-webui/bootstrap-admin.yaml, manifests/jupyter's
      # jupyter-token). The chart envFrom's this whole secret into both
      # server and worker regardless of which values it's "supposed" to
      # cover, so the bootstrap vars ride along for free:
      # IMPORTANT: setting existingSecret skips the chart's ENTIRE generated
      # config secret (templates/secret.yaml's condition is `not
      # existingSecret.secretName` -- all-or-nothing), not just secret_key
      # and the password. That means AUTHENTIK_POSTGRESQL__HOST/NAME/USER/
      # PORT never get set either unless included explicitly below --
      # learned this the hard way (server/worker crash-looped on
      # "PostgreSQL connection failed ... host: 'localhost'" until these
      # were added). Host must match the postgresql subchart's Service name
      # (`{{ .Release.Name }}-postgresql`, i.e. "authentik-postgresql" here).
      #   kubectl create secret generic authentik-secrets -n authentik \
      #     --from-literal=AUTHENTIK_SECRET_KEY=<random, 60+ chars, never change once set> \
      #     --from-literal=AUTHENTIK_POSTGRESQL__PASSWORD=<random, must match authentik-postgresql secret below> \
      #     --from-literal=AUTHENTIK_POSTGRESQL__HOST=authentik-postgresql \
      #     --from-literal=AUTHENTIK_POSTGRESQL__NAME=authentik \
      #     --from-literal=AUTHENTIK_POSTGRESQL__USER=authentik \
      #     --from-literal=AUTHENTIK_POSTGRESQL__PORT=5432 \
      #     --from-literal=AUTHENTIK_BOOTSTRAP_EMAIL=<email> \
      #     --from-literal=AUTHENTIK_BOOTSTRAP_PASSWORD=<random> \
      #     --from-literal=AUTHENTIK_BOOTSTRAP_TOKEN=<random, for API automation without the manual signin dance>
      existingSecret:
        secretName: authentik-secrets
      error_reporting:
        enabled: false
    # Declarative provider/application config (see blueprint-open-webui.yaml)
    # -- captures what would otherwise be pure live-database state from the
    # imperative API calls made while first wiring up Open WebUI's OIDC
    # login (#18), so it survives a Postgres wipe instead of silently
    # vanishing with no record in git.
    blueprints:
      configMaps:
        - authentik-blueprint-open-webui
        - authentik-blueprint-google-source
    postgresql:
      enabled: true
      auth:
        # Same out-of-band pattern; password value must match
        # AUTHENTIK_POSTGRESQL__PASSWORD in authentik-secrets above:
        #   kubectl create secret generic authentik-postgresql -n authentik \
        #     --from-literal=postgres-password=<same random value> \
        #     --from-literal=password=<same random value>
        existingSecret: authentik-postgresql
      primary:
        persistence:
          enabled: true
          storageClass: nfs
          size: 10Gi
    server:
      # No resources upstream -- left the scheduler with no signal to spread
      # server/worker during a mass reschedule (e.g. the nightly uncordon
      # burst); both piled onto ipc4 (2026-08-21 incident). Values per the
      # chart's own suggested defaults.
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: 500m, memory: 512Mi}
      service:
        annotations:
          # Tailnet exposure, same proven Service-mode pattern as
          # manifests/gruesome, manifests/open-webui, manifests/jupyter.
          tailscale.com/expose: "true"
          tailscale.com/hostname: "authentik"
    worker:
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: 500m, memory: 512Mi}
