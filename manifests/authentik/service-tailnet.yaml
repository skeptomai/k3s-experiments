# Standalone tailnet-exposure Service for authentik-server, separate from the
# Helm chart's own ClusterIP Service (authentik-server). Added 2026-09-27
# alongside manifests/tailscale-operator/proxygroup.yaml.
#
# Why a separate Service rather than annotating the chart's own: the
# goauthentik/authentik chart's server.service values support `type` but do
# NOT expose `loadBalancerClass` (checked against the chart's values.yaml) --
# setting type: LoadBalancer through the chart alone would get claimed by
# this cluster's default LoadBalancer (MetalLB, pool 192.168.88.240-.250)
# instead of the Tailscale operator, handing out the wrong kind of IP
# entirely. A second, independent Service selecting the same pods sidesteps
# this without needing chart support for a field it doesn't have.
#
# tailscale.com/hostname preserved as "authentik" -> authentik.taildd208.ts.net,
# matching the previous (now-removed) chart-annotation exposure exactly --
# see manifests/tailscale-operator/proxygroup.yaml for the incident this fixes.
apiVersion: v1
kind: Service
metadata:
  name: authentik-tailnet
  namespace: authentik
  annotations:
    tailscale.com/proxy-group: "ingress-proxies"
    tailscale.com/hostname: "authentik"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: authentik
    app.kubernetes.io/component: server
  ports:
    - port: 80
      targetPort: 9000
      name: http
