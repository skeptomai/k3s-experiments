apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-forgejo
  namespace: authentik
data:
  # Authentik Blueprint for Forgejo SSO login (interactive web UI only --
  # this does not grant any Forgejo API token; see forgejo.md for how
  # programmatic access is handled separately). Forgejo runs outside k3s,
  # via Pelagos on nazgul (home-monitoring/pelagos/compose-forgejo.reml),
  # not as a k3s Service -- reachable at nazgul.taildd208.ts.net:3030.
  #
  # client_id/client_secret deliberately NOT pinned here (state: present
  # only touches attrs actually listed, same pattern as
  # blueprint-open-webui.yaml) -- fetch them from the provider after Flux
  # reconciles this, then register Forgejo's OAuth2 auth source with them:
  #   TOKEN=$(op item get "Authentik (k3s cluster)" --fields "api-token" --reveal)
  #   curl http://authentik.taildd208.ts.net/api/v3/providers/oauth2/?name=Forgejo \
  #     -H "Authorization: Bearer $TOKEN" | jq '.results[0] | {client_id, client_secret}'
  #   ssh -i ~/.ssh/Omen root@nazgul.taildd208.ts.net pelagos exec -u 1000:1000 forgejo-forgejo \
  #     forgejo admin auth add-oauth --name authentik --provider openidConnect \
  #     --key <client_id> --secret <client_secret> \
  #     --auto-discover-url https://authentik-public-ingress.taildd208.ts.net/application/o/forgejo/.well-known/openid-configuration
  #
  # Discovery/auto-discover-url MUST be the Funnel hostname
  # (authentik-public-ingress.taildd208.ts.net), not authentik.taildd208.ts.net
  # -- Forgejo's container runs on its own isolated Docker bridge network
  # (compose-forgejo.reml's net-forgejo, 10.90.2.0/24) with real internet
  # egress but no Tailscale/MagicDNS presence, so it can't resolve or reach
  # plain tailnet-only hostnames at all, only ones Funnel has made genuinely
  # internet-routable (confirmed: plain `authentik.taildd208.ts.net` fails
  # DNS resolution inside the container with NXDOMAIN; the funnel hostname
  # resolves fine via public DNS and the well-known endpoint is reachable).
  # This matters for the whole login flow, not just initial setup -- token
  # exchange and userinfo calls happen container-to-Authentik on every
  # login, so the funnel hostname is a hard requirement here, not just a
  # one-time discovery-URL convenience.
  #
  # grant_types must be set explicitly at creation time -- Authentik's API
  # silently defaults it to [] (no grants at all) otherwise (bit us on the
  # Open WebUI integration, see blueprint-open-webui.yaml).
  forgejo.yaml: |
    version: 1
    metadata:
      name: forgejo-oidc
    entries:
      - model: "authentik_providers_oauth2.oauth2provider"
        id: "forgejo-provider"
        identifiers:
          name: "Forgejo"
        state: "present"
        attrs:
          name: "Forgejo"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: "confidential"
          grant_types:
            - "authorization_code"
            - "refresh_token"
          # Forgejo's callback path for an external OAuth2/OIDC auth source
          # is /user/oauth2/<source name>/callback -- source name must be
          # "authentik" to match the `forgejo admin auth add-oauth --name`
          # value used when registering it (see comment above).
          redirect_uris:
            - url: "http://nazgul.taildd208.ts.net:3030/user/oauth2/authentik/callback"
              matching_mode: "strict"
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: "authentik_core.application"
        id: "forgejo-application"
        state: "present"
        identifiers:
          slug: "forgejo"
        attrs:
          name: "Forgejo"
          slug: "forgejo"
          policy_engine_mode: "any"
          meta_launch_url: "http://nazgul.taildd208.ts.net:3030/"
          meta_description: "Self-hosted git (Forgejo) on nazgul"
          provider: !KeyOf forgejo-provider
