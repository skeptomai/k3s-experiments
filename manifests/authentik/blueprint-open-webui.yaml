apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-open-webui
  namespace: authentik
data:
  # Authentik Blueprint (declarative provider/application config) --
  # captures what was otherwise only live database state from imperative
  # API calls made while debugging #18. Without this, wiping Authentik's
  # Postgres would silently lose the entire Open WebUI OIDC integration
  # with no record in git, breaking this project's GitOps pattern.
  #
  # client_id/client_secret deliberately NOT pinned here (state: present
  # only touches attrs actually listed, so re-applying this leaves
  # existing credentials alone) -- consistent with this project's secrets
  # staying out of git. If the DB is ever wiped and this blueprint
  # reapplies fresh, Authentik auto-generates a NEW client_id/secret pair;
  # fetch them from the provider afterward and update the open-webui-oidc
  # Secret to match:
  #   TOKEN=$(op item get "Authentik (k3s cluster)" --fields "api-token" --reveal)
  #   curl http://authentik.taildd208.ts.net/api/v3/providers/oauth2/?name=Open%20WebUI \
  #     -H "Authorization: Bearer $TOKEN" | jq '.results[0] | {client_id, client_secret}'
  #
  # grant_types is the field that actually broke this integration during
  # setup -- Authentik's API silently defaults it to [] (no grants
  # permitted at all) if not set explicitly at creation time. Pinning it
  # here means a fresh blueprint-driven creation won't repeat that bug.
  open-webui.yaml: |
    version: 1
    metadata:
      name: open-webui-oidc
    entries:
      - model: "authentik_providers_oauth2.oauth2provider"
        id: "open-webui-provider"
        identifiers:
          name: "Open WebUI"
        state: "present"
        attrs:
          name: "Open WebUI"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: "confidential"
          grant_types:
            - "authorization_code"
            - "refresh_token"
          # Both hostnames registered (#18 phase 3): Open WebUI's
          # OPENID_REDIRECT_URI is deliberately unset so it derives the
          # redirect_uri per-request (see deployment.yaml's comment), so
          # whichever hostname a login actually started from must have its
          # exact URI here too -- matching_mode is strict, no wildcard.
          redirect_uris:
            - url: "http://open-webui.taildd208.ts.net/oauth/oidc/callback"
              matching_mode: "strict"
            # Not "open-webui-public.taildd208.ts.net" -- the Ingress's
            # tailscale.com/hostname annotation isn't honored, the real
            # device name is auto-generated as <namespace>-<ingress-name>
            # -ingress (verified via `kubectl describe ingress public -n
            # open-webui` after applying, not guessed).
            - url: "https://open-webui-public-ingress.taildd208.ts.net/oauth/oidc/callback"
              matching_mode: "strict"
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: "authentik_core.application"
        id: "open-webui-application"
        state: "present"
        identifiers:
          slug: "open-webui"
        attrs:
          name: "Open WebUI"
          slug: "open-webui"
          policy_engine_mode: "any"
          meta_launch_url: "http://open-webui.taildd208.ts.net/"
          meta_description: "Chat frontend for the Nemotron-3-Super-120B vLLM instance on spark-0d93"
          provider: !KeyOf open-webui-provider
