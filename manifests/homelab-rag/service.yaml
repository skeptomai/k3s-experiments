apiVersion: v1
kind: Service
metadata:
  name: homelab-rag
  namespace: homelab-rag
  annotations:
    # Tailnet exposure, same proven Service-mode pattern as
    # manifests/web-search, manifests/gruesome, manifests/jupyter,
    # manifests/open-webui, manifests/postgres-pgvector.
    #
    # 2026-09-28: reverted from a ProxyGroup/Tailscale-Services migration
    # (see git history) -- that path needed an ACL grants change that broke
    # core tailnet connectivity, and turned out to be unnecessary: this
    # plain pattern was never actually broken (confirmed live against
    # postgres-pgvector, which stayed on it the whole time and kept working
    # throughout). Don't re-attempt ProxyGroup without a much stronger
    # reason and a tested rollback plan.
    tailscale.com/expose: "true"
    tailscale.com/hostname: "homelab-rag"
spec:
  selector:
    app: homelab-rag
  ports:
    - port: 80
      targetPort: 8080
