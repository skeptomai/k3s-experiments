---
apiVersion: v1
kind: Service
metadata:
  name: omen
  namespace: homelab-rag
  annotations:
    # Same Tailscale-operator egress pattern as spark-egress.yaml - lets
    # pods in this namespace reach omen (a tailnet-only host outside the
    # cluster) via normal cluster DNS (omen.homelab-rag.svc.cluster.local)
    # to trigger a reindex over SSH. A plain cluster pod has no outbound
    # tailnet route otherwise (confirmed with spark-0d93: DNS resolution
    # fails outright without this).
    tailscale.com/tailnet-fqdn: "omen.taildd208.ts.net"
spec:
  externalName: "placeholder"
  type: ExternalName
