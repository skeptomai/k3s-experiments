apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-rag
  namespace: homelab-rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelab-rag
  template:
    metadata:
      labels:
        app: homelab-rag
    spec:
      # No longer stateless as of the 2026-09-21 in-cluster indexing
      # redesign - homelab-rag-sources PVC holds the git clones indexer.py
      # maintains, so reindexing stays incremental across pod restarts.
      automountServiceAccountToken: false
      volumes:
        - name: sources
          persistentVolumeClaim:
            claimName: homelab-rag-sources
        # One read-only deploy key per private repo in indexer.py's
        # GIT_REPOS (file name == the `key` field there), plus a
        # known_hosts pinning github.com's and Forgejo's real host keys.
        # Created out-of-band, not in git - see
        # scripts/homelab-rag-image/README.md.
        - name: git-keys
          secret:
            secretName: homelab-rag-secrets
            defaultMode: 0400
            items:
              - key: known-hosts
                path: known_hosts
              - key: github-dotfiles
                path: github-dotfiles
              - key: github-orgfiles
                path: github-orgfiles
              - key: github-hibernate_debugging
                path: github-hibernate_debugging
              - key: github-home-monitoring
                path: github-home-monitoring
              - key: forgejo-pydantic-agent
                path: forgejo-pydantic-agent
              - key: forgejo-claude-skills-mirror
                path: forgejo-claude-skills-mirror
              - key: forgejo-backup-kit
                path: forgejo-backup-kit
              - key: forgejo-agent-coordinator
                path: forgejo-agent-coordinator
      containers:
        - name: homelab-rag
          image: 192.168.89.2:5004/homelab-rag:latest
          ports:
            - containerPort: 8080
          env:
            # Secret created once, out-of-band, not in git - see
            # scripts/homelab-rag-image/README.md.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homelab-rag-secrets
                  key: openai-api-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-rag-secrets
                  key: postgres-password
            - name: SOURCES_ROOT
              value: "/data/sources"
            - name: GIT_KEYS_DIR
              value: "/etc/git-keys"
            # Cluster-internal name via the git-repos-egress ExternalName
            # Service (manifests/homelab-rag/git-repos-egress.yaml) - a
            # plain pod has no outbound tailnet route to Forgejo otherwise.
            - name: FORGEJO_SSH_HOST
              value: "git-repos.homelab-rag.svc.cluster.local"
          volumeMounts:
            - name: sources
              mountPath: /data/sources
            - name: git-keys
              mountPath: /etc/git-keys
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
