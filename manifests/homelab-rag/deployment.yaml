apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-rag
  namespace: homelab-rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelab-rag
  template:
    metadata:
      labels:
        app: homelab-rag
    spec:
      # Stateless, no k8s API access needed (same as manifests/web-search).
      automountServiceAccountToken: false
      volumes:
        # omen-ssh-key holds a *dedicated* key, restricted on omen's side
        # (authorized_keys `command=".../rebuild-rag-index.sh"`) to running
        # only the reindex script - a compromised pod can't use it for
        # anything else on omen. Created out-of-band, not in git - see
        # scripts/homelab-rag-image/README.md.
        - name: omen-ssh
          secret:
            secretName: homelab-rag-secrets
            defaultMode: 0400
            items:
              - key: omen-ssh-private-key
                path: id_ed25519
              - key: omen-ssh-known-hosts
                path: known_hosts
      containers:
        - name: homelab-rag
          image: 192.168.89.2:5004/homelab-rag:latest
          ports:
            - containerPort: 8080
          env:
            # Secret created once, out-of-band, not in git - see
            # scripts/homelab-rag-image/README.md.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homelab-rag-secrets
                  key: openai-api-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-rag-secrets
                  key: postgres-password
            # Cluster-internal name via the omen-egress ExternalName
            # Service (manifests/homelab-rag/omen-egress.yaml) - a plain
            # pod has no outbound tailnet route to omen otherwise.
            - name: OMEN_SSH_HOST
              value: "omen.homelab-rag.svc.cluster.local"
          volumeMounts:
            - name: omen-ssh
              mountPath: /etc/omen-ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
