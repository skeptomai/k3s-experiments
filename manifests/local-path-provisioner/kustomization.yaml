apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml
patches:
  # No resources upstream -- see cert-manager/kustomization.yaml for why
  # this matters (2026-08-21 ipc4 pod-pileup incident).
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
        namespace: local-path-storage
      spec:
        template:
          spec:
            containers:
              - name: local-path-provisioner
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 128Mi}
    target:
      kind: Deployment
      name: local-path-provisioner
