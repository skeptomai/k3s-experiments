# Gruesome self-hosted platform (skeptomai/gruesome, selfhost/).
#
# NOTE — the `gruesome-secrets` Secret is intentionally NOT in this repo (no
# sealing mechanism is configured here). Create it out-of-band once:
#
#   kubectl -n gruesome create secret generic gruesome-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=S3_ACCESS_KEY="<aistor scoped access key>" \
#     --from-literal=S3_SECRET_KEY="<aistor scoped secret key>"
#
# The scoped AIStor key is the least-privilege svcacct on nazgul (see
# orgfiles home-network/services.md). Rotate by recreating the secret + restarting.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
