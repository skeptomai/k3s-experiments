apiVersion: v1
kind: Service
metadata:
  name: gruesome-platform
  namespace: gruesome
  annotations:
    # Expose on the tailnet via the shared ingress ProxyGroup (see
    # manifests/tailscale-operator/proxygroup.yaml) → gruesome.taildd208.ts.net.
    # Plain HTTP (L3 Service mode, not Ingress/HTTPS) so the HTTP presigned AIStor
    # URLs aren't blocked as mixed content. Reachable from any Tailscale device.
    tailscale.com/proxy-group: "ingress-proxies"
    tailscale.com/hostname: "gruesome"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector: { app: gruesome-platform }
  ports:
    - port: 80
      targetPort: 8080
