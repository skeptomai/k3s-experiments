apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    # Plain LAN IP -- same as every other exporter/scrape target in this
    # cluster, no Tailscale involved (docs/loki-log-aggregation-plan.md).
    clients:
      - url: http://192.168.89.2:3100/loki/api/v1/push

    scrape_configs:
      # -- Container logs --------------------------------------------------
      # Standard Promtail Kubernetes service-discovery config: discovers
      # every pod via the API server and tails its log file under
      # /var/log/pods (kubelet-standard path regardless of CRI -- works the
      # same for Pelagos as it did for containerd). No per-app config.
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Belt-and-suspenders: Promtail's own kubernetes_sd target manager
          # already restricts the API-side list/watch to this node via a
          # "spec.nodeName=<$HOSTNAME>" field selector it builds internally
          # (fulfillKubePodSelector) -- which only works because the
          # DaemonSet overrides $HOSTNAME to the real node name (see
          # daemonset.yaml; without that override $HOSTNAME defaults to the
          # pod's own name, not the node's, and discovery silently returns
          # zero pods). This relabel is a redundant explicit filter on the
          # same label in case that ever changes.
          - source_labels: [__meta_kubernetes_pod_node_name]
            regex: "${NODE_NAME}"
            action: keep
          - source_labels: [__meta_kubernetes_pod_controller_name]
            regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
            action: replace
            target_label: __tmp_controller_name
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app
              - __tmp_controller_name
              - __meta_kubernetes_pod_name
            regex: ^;*([^;]+)(;.*)?$
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node_name
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [namespace, app]
            separator: /
            action: replace
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            action: replace
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__

      # -- systemd journal --------------------------------------------------
      # The actual point of this exercise: pelagos-cri and k3s/k3s-agent run
      # as systemd services, not pods, so their crash/restart history only
      # ever lived in each node's journal -- kubectl has zero visibility
      # into it. Scoped to just these units to keep noise down; requires
      # persistent journaling (/var/log/journal, not /run/log/journal) on
      # the host, verified/enabled separately per
      # docs/loki-log-aggregation-plan.md.
      - job_name: journal
        journal:
          path: /var/log/journal
          max_age: 12h
          matches: "_SYSTEMD_UNIT=pelagos-cri.service _SYSTEMD_UNIT=k3s.service _SYSTEMD_UNIT=k3s-agent.service"
          labels:
            job: systemd-journal
        relabel_configs:
          - source_labels: [__journal__systemd_unit]
            target_label: unit
          - source_labels: [__journal__hostname]
            target_label: hostname
