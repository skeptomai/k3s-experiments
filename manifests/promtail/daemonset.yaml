apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      # ipc4-6 are intentionally untainted (this repo's CLAUDE.md) but be
      # explicit anyway, same as node-exporter's DaemonSet: every node,
      # including control-plane, gets a Promtail instance.
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          # NOT the stock grafana/promtail image: as pulled ("latest" ->
          # v3.6.8), it logs "journal target was configured but support
          # for reading the systemd journal is not compiled into this
          # build of promtail" -- confirmed live, not assumed. The stock
          # Docker Hub image ships CGO_ENABLED=0 (no libsystemd), even
          # though Loki's own clients/cmd/promtail/Dockerfile supports a
          # PROMTAIL_JOURNAL_ENABLED=true build. Rebuilt that exact
          # Dockerfile (same v3.6.8 source, matching revision 138c391f)
          # with CGO + PROMTAIL_JOURNAL_ENABLED=true and pushed to the
          # cluster's local registry -- see docs/loki-log-aggregation-plan.md.
          image: 192.168.89.2:5004/promtail-journal:v3.6.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
            - -config.expand-env=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9080
              name: http-metrics
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            # Needs read access to root-owned host log/journal files.
            runAsUser: 0
            privileged: false
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: journal
          hostPath:
            path: /var/log/journal
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
