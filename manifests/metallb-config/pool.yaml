# MetalLB address pool for LoadBalancer services on bridge-lan.
# 192.168.88.240-.250 is carved out of the MikroTik DHCP pool (range shrunk to
# .239) so these addresses are never handed out dynamically. L2 (ARP) mode — the
# elected speaker answers ARP for each assigned IP, matching the flat LAN (same
# approach as kube-vip's control-plane VIP, on a non-overlapping address).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.88.240-192.168.88.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
