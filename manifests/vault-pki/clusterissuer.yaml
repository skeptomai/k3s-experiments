# cert-manager ClusterIssuer backed by OpenBao's PKI intermediate CA.
#
# Cut over from Vault to OpenBao (k3s-experiments#13, Stage 4) — object name kept
# as vault-pki-issuer deliberately: renaming would force every Certificate's
# issuerRef to be edited, which would trigger unnecessary re-issuance. Only
# spec.vault.server changed; caBundle is unchanged since both Vault's and
# OpenBao's TLS listener certs come from the same internal-ca-issuer root, so
# this field was always decoupled from which backend is serving.
#
# Trust chain:
#   internal-ca (self-signed, cert-manager) → OpenBao pki_int (intermediate) → leaf certs
#
# caBundle is the internal-ca cert (tls.crt from the cert-manager/internal-ca-tls Secret),
# used to verify the backend's TLS certificate (also signed by internal-ca-issuer).
# It is a public cert — safe to commit.
#
# Prerequisite: run scripts/setup-openbao-pki.sh to configure OpenBao.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-pki-issuer
spec:
  vault:
    server: https://openbao.openbao.svc:8200
    path: pki_int/sign/home-lab
    caBundle: 
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager
        serviceAccountRef:
          name: cert-manager
