# cert-manager ClusterIssuer backed by Vault PKI intermediate CA.
#
# Trust chain:
#   internal-ca (self-signed, cert-manager) → Vault pki_int (intermediate) → leaf certs
#
# caBundle is the internal-ca cert (tls.crt from the cert-manager/internal-ca-tls Secret),
# used to verify Vault's TLS certificate (which is also signed by internal-ca-issuer).
# It is a public cert — safe to commit.
#
# Prerequisite: run scripts/setup-vault-pki.sh to configure Vault.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-pki-issuer
spec:
  vault:
    server: https://vault.vault.svc:8200
    path: pki_int/sign/home-lab
    caBundle: 
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager
        serviceAccountRef:
          name: cert-manager
