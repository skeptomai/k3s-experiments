apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: jupyter
  annotations:
    # Service-mode tailnet exposure -> jupyter.taildd208.ts.net, same
    # proven pattern as manifests/gruesome and manifests/open-webui.
    #
    # 2026-09-28: reverted from a ProxyGroup/Tailscale-Services migration --
    # see manifests/homelab-rag/service.yaml for why.
    tailscale.com/expose: "true"
    tailscale.com/hostname: "jupyter"
spec:
  selector:
    app: jupyter
  ports:
    - port: 80
      targetPort: 8888
