apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: jupyter
  annotations:
    # Service-mode tailnet exposure -> jupyter.taildd208.ts.net, via the
    # shared ingress ProxyGroup (see manifests/tailscale-operator/proxygroup.yaml).
    tailscale.com/proxy-group: "ingress-proxies"
    tailscale.com/hostname: "jupyter"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: jupyter
  ports:
    - port: 80
      targetPort: 8888
