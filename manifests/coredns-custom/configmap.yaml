# Split-horizon DNS for the tailnet name of nazgul (the AIStor/S3 + registry host).
#
# Why: apps like gruesome are configured with S3_ENDPOINT=nazgul.taildd208.ts.net
# so that BROWSERS (off-LAN, on the tailnet) can fetch presigned URLs. But in-cluster
# pods are NOT on the tailnet and can't resolve MagicDNS names, so the *server* side
# S3 calls fail ("dispatch failure"). This override makes cluster pods resolve that
# one name to nazgul's LAN IP (reachable from the nodes), while browsers keep
# resolving it via their own MagicDNS to nazgul's tailnet IP. Both reach the same
# AIStor; presigned-URL signatures (computed for host nazgul.taildd208.ts.net) stay valid.
#
# k3s's coredns imports /etc/coredns/custom/*.server, so this becomes a dedicated
# server block (a second `hosts` in the MAIN block is rejected — "only once per block").
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  nazgul.server: |
    nazgul.taildd208.ts.net:53 {
      hosts {
        192.168.89.2 nazgul.taildd208.ts.net
        fallthrough
      }
    }
  # Same split-horizon problem, this time for Authentik (#18): Open WebUI's
  # backend calls OPENID_PROVIDER_URL = http://authentik.taildd208.ts.net/...
  # server-to-server to fetch OIDC discovery metadata and exchange tokens,
  # but pods aren't on the tailnet and can't resolve MagicDNS names either
  # ("httpx.ConnectError: Name or service not known"). Unlike nazgul (a real
  # LAN host), Authentik itself runs in this cluster, so the fix is even
  # simpler: point pods at its Service ClusterIP directly rather than a LAN
  # IP. Browsers still resolve the same hostname via real Tailscale MagicDNS
  # to the tailscale-operator's proxy device, unaffected by this override.
  # ClusterIP is stable for a Service's lifetime; if authentik-server is ever
  # deleted/recreated (not just its pods), re-check with:
  #   kubectl get svc authentik-server -n authentik -o jsonpath='{.spec.clusterIP}'
  authentik.server: |
    authentik.taildd208.ts.net:53 {
      hosts {
        10.43.137.208 authentik.taildd208.ts.net
        fallthrough
      }
    }
