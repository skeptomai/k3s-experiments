# Read-only cluster access for the "cluster_health" Tool (config.el-equivalent
# for open-webui -- see the Tool registration script). Scoped to exactly
# get/list/watch on nodes and pods, cluster-wide (node health/temps and pod
# status aren't namespaced concepts) -- no write verbs, no other resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui
  namespace: open-webui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-webui-cluster-health-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-webui-cluster-health-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-webui-cluster-health-reader
subjects:
  - kind: ServiceAccount
    name: open-webui
    namespace: open-webui
