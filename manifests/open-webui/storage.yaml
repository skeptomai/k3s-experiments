# Migrated off NFS 2026-08-24: open-webui's SQLite DB runs in WAL mode
# (webui.db-shm/-wal), and SQLite's own docs warn against WAL on network
# filesystems -- NFS's locking semantics made admin-panel queries (heavier
# than normal chat traffic) slow and sometimes hang. local-path is
# node-local disk, so it's node-pinned (fine for this single-replica
# deployment, which was already effectively pinned by the PV anyway) --
# traded node-mobility (an NFS-backed pod's data follows it to any node)
# for performance, a narrow SQLite-specific tradeoff, not a signal to move
# other stateful workloads (e.g. Authentik's Postgres) off NFS.
#
# Data copied via a one-off migration pod (rsync) while the deployment was
# scaled to 0 for a consistent snapshot, verified byte-identical before
# cutover. Old NFS PVC (open-webui-data) deleted 2026-08-24 once the new
# storage was confirmed stable in real use (reclaimPolicy: Delete, so this
# also freed the underlying NFS-subdir data -- no longer recoverable).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data-local
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
