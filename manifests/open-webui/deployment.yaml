apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # spark-0d93's tailnet IP — stable (unlike the dynamic Pelagos
            # bridge IPs we chased earlier), reachable from cluster pods
            # (confirmed via a one-off curl pod before writing this).
            - name: OPENAI_API_BASE_URL
              value: "http://100.79.172.75:8000/v1"
            - name: OPENAI_API_KEY
              value: "not-needed"
            # WEBUI_AUTH intentionally omitted (default: auth enabled) --
            # a real admin account now exists (see bootstrap-admin.yaml),
            # and Open WebUI refuses to boot with auth disabled once any
            # user exists, by design (would let anyone act as that user
            # with no login at all).
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
