apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # spark-0d93's tailnet IP — stable (unlike the dynamic Pelagos
            # bridge IPs we chased earlier), reachable from cluster pods
            # (confirmed via a one-off curl pod before writing this).
            - name: OPENAI_API_BASE_URL
              value: "http://100.79.172.75:8000/v1"
            - name: OPENAI_API_KEY
              value: "not-needed"
            # WEBUI_AUTH intentionally omitted (default: auth enabled) --
            # a real admin account now exists (see bootstrap-admin.yaml),
            # and Open WebUI refuses to boot with auth disabled once any
            # user exists, by design (would let anyone act as that user
            # with no login at all).
            #
            # Authentik OIDC (#18 phase 1) -- ENABLE_LOGIN_FORM/
            # ENABLE_PASSWORD_AUTH deliberately left at their defaults
            # (both true) for now, so local login stays as a fallback
            # while OIDC gets tested. Revisit once confirmed working.
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "authentik"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OPENID_PROVIDER_URL
              value: "http://authentik.taildd208.ts.net/application/o/open-webui/.well-known/openid-configuration"
            # OPENID_REDIRECT_URI intentionally NOT set (#18 phase 3) --
            # open_webui/utils/oauth.py's handle_login() does:
            #   redirect_uri = (client.server_metadata or {}).get('redirect_uri')
            #     or request.url_for('oauth_login_callback', provider=provider)
            # Setting this env var forces the FIRST branch unconditionally,
            # pinning every login to one fixed hostname regardless of which
            # one the request actually came in on -- broke SSO for the
            # public Funnel hostname (ingress-funnel.yaml) since Authentik
            # would only ever redirect back to the tailnet-only one, which a
            # public/non-tailnet user can't reach. Leaving it unset falls
            # through to request.url_for(), which correctly derives the
            # right scheme+host per request, letting both hostnames work.
            # Authentik's provider must have BOTH exact redirect_uris
            # registered (see blueprint-open-webui.yaml) since matching_mode
            # is strict.
            - name: WEBUI_URL
              value: "http://open-webui.taildd208.ts.net"
            # open-webui-oidc Secret created once via kubectl, not in git
            # (same out-of-band pattern as open-webui-admin, jupyter-token,
            # authentik-secrets). Values come from the Authentik OAuth2
            # Provider created for the "open-webui" Application (pk=1):
            #   kubectl create secret generic open-webui-oidc -n open-webui \
            #     --from-literal=OAUTH_CLIENT_ID=<from Authentik provider> \
            #     --from-literal=OAUTH_CLIENT_SECRET=<from Authentik provider>
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-oidc
                  key: OAUTH_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
