# Tailscale Ingress — auto-provisions its own tailnet hostname via the
# tailscale-operator, no MikroTik DNS record needed (unlike the Traefik
# pattern used elsewhere in this repo, e.g. manifests/gruesome).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
  annotations:
    tailscale.com/hostname: open-webui
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: open-webui
      port:
        number: 80
