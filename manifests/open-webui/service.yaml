apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
  annotations:
    # Service-mode tailnet exposure -> open-webui.taildd208.ts.net, via the
    # shared ingress ProxyGroup (see manifests/tailscale-operator/proxygroup.yaml).
    # Still L3 Service mode, not Ingress -- an Ingress-based attempt here
    # produced an ugly auto-generated hostname instead of respecting
    # tailscale.com/hostname, which L3 mode does honor.
    tailscale.com/proxy-group: "ingress-proxies"
    tailscale.com/hostname: "open-webui"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: open-webui
  ports:
    - port: 80
      targetPort: 8080
