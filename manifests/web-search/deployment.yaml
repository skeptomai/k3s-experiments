apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-search
  namespace: web-search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-search
  template:
    metadata:
      labels:
        app: web-search
    spec:
      # Stateless, no k8s API access needed at all.
      automountServiceAccountToken: false
      containers:
        - name: web-search
          image: 192.168.89.2:5004/web-search:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
