apiVersion: v1
kind: Service
metadata:
  name: web-search
  namespace: web-search
  annotations:
    # Tailnet exposure via the shared ingress ProxyGroup (see
    # manifests/tailscale-operator/proxygroup.yaml).
    # Purpose: gptel's web_search tool calls this from omen, which is
    # deliberately kept stateless (no local Python/ddgs install there) --
    # see scripts/web-search-image/README.md.
    tailscale.com/proxy-group: "ingress-proxies"
    tailscale.com/hostname: "web-search"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: web-search
  ports:
    - port: 80
      targetPort: 8080
