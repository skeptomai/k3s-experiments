# Static local PVs for OpenBao's Raft data — one per i5 worker (ipc4/5/6).
# OpenBao-with-Raft replicates at the app layer, so each node wants its own local
# volume; no dynamic provisioner (which is blocked by pelagos#334 anyway).
# WaitForFirstConsumer so each PV binds to the pod scheduled on its node.
#
# Deliberately separate from vault-local / /var/lib/vault-data — this is a fully
# parallel deployment during the k3s-experiments#13 migration, never sharing
# on-disk state with the existing Vault StatefulSet.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openbao-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-data-ipc4
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: openbao-local
  local:
    path: /var/lib/openbao-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [ipc4] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-data-ipc5
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: openbao-local
  local:
    path: /var/lib/openbao-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [ipc5] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-data-ipc6
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: openbao-local
  local:
    path: /var/lib/openbao-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [ipc6] }
