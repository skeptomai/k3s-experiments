apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
---
# Needed by OpenBao's Kubernetes auth method (TokenReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
