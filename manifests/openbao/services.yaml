# Headless service for Raft peer DNS (openbao-0.openbao-internal, ...).
# publishNotReadyAddresses so peers can find each other before they're unsealed.
apiVersion: v1
kind: Service
metadata:
  name: openbao-internal
  namespace: openbao
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: openbao
  ports:
    - { name: https, port: 8200, targetPort: 8200 }
    - { name: cluster, port: 8201, targetPort: 8201 }
---
# Client service for the OpenBao API.
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: openbao
spec:
  selector:
    app: openbao
  ports:
    - { name: https, port: 8200, targetPort: 8200 }
---
# NodePort so nazgul's blackbox-exporter (outside the cluster) can probe
# /v1/sys/health for real seal-state alerting — that endpoint is unauthenticated
# by design (no secrets exposed) and is the standard way to externally health-check
# Vault/OpenBao. Matches the existing NodePort convention for kube-state-metrics /
# spire-metrics (pinned to ipc4 by convention, reachable via any node in practice).
apiVersion: v1
kind: Service
metadata:
  name: openbao-nodeport
  namespace: openbao
spec:
  type: NodePort
  selector:
    app: openbao
  ports:
    - { name: https, port: 8200, targetPort: 8200, nodePort: 30930 }
