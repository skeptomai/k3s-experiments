# OpenBao's own TLS listener cert. References the existing internal-ca-issuer
# ClusterIssuer (currently defined/owned by manifests/vault/tls.yaml) — do NOT
# redefine selfsigned-issuer / internal-ca / internal-ca-issuer here. Those are
# shared cluster-wide root CA resources, not Vault-specific; see k3s-experiments#13
# tracked follow-up to extract them into their own Kustomization before Vault is
# decommissioned (Stage 6), so deleting the vault Kustomization doesn't take the
# shared root CA down with it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  secretName: openbao-tls
  duration: 8760h    # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  commonName: openbao.openbao.svc.cluster.local
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc"
    - "*.openbao-internal.openbao.svc.cluster.local"
    - localhost
  ipAddresses:
    - 127.0.0.1
