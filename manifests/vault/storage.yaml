# Static local PVs for Vault's Raft data — one per i5 worker (ipc4/5/6).
# Vault-with-Raft replicates at the app layer, so each node wants its own local
# volume; no dynamic provisioner (which is blocked by pelagos#334 anyway).
# WaitForFirstConsumer so each PV binds to the pod scheduled on its node.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vault-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-data-ipc4
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: vault-local
  local:
    path: /var/lib/vault-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [ipc4] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-data-ipc5
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: vault-local
  local:
    path: /var/lib/vault-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [ipc5] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-data-ipc6
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: vault-local
  local:
    path: /var/lib/vault-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [ipc6] }
