apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
# Needed by Vault's Kubernetes auth method (TokenReview). Harmless until enabled.
# Note: Vault's own SA token won't mount under Pelagos (pelagos#334, Vault is
# Alpine-based), so the k8s auth method is blocked until that's fixed — but core
# Vault + Raft don't need it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
