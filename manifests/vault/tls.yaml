# Vault's own TLS listener cert. The shared root CA (selfsigned-issuer,
# internal-ca, internal-ca-issuer) used to live here too, but moved to
# manifests/internal-ca/ (k3s-experiments#13, task #8) — decommissioning
# Vault must not take the cluster-wide trust root down with it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  duration: 8760h    # 1y
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
  commonName: vault.vault.svc.cluster.local
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - "*.vault-internal"
    - "*.vault-internal.vault.svc"
    - "*.vault-internal.vault.svc.cluster.local"
    - localhost
  ipAddresses:
    - 127.0.0.1
