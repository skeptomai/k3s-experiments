apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault-internal
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000          # chowns the local PV + tls secret so the vault user can read/write
      # One Raft member per i5 worker: a single node loss costs only one member.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-class, operator: In, values: [performance] }
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: vault }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vault
          image: hashicorp/vault:1.18
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          args: []   # prevent the image CMD (server -dev) from appending as junk args
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: VAULT_RAFT_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: VAULT_API_ADDR
              value: "https://$(POD_NAME).vault-internal:8200"
            - name: VAULT_CLUSTER_ADDR
              value: "https://$(POD_NAME).vault-internal:8201"
            - name: VAULT_ADDR
              value: "https://127.0.0.1:8200"
            - name: VAULT_CACERT
              value: "/vault/tls/ca.crt"
          ports:
            - { name: https, containerPort: 8200 }
            - { name: cluster, containerPort: 8201 }
          volumeMounts:
            - { name: config, mountPath: /vault/config }
            - { name: tls, mountPath: /vault/tls, readOnly: true }
            - { name: data, mountPath: /vault/data }
          readinessProbe:
            httpGet:
              scheme: HTTPS
              port: 8200
              path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              port: 8200
              path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200&perfstandbyok=true"
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: vault-config }
        - name: tls
          secret: { secretName: vault-tls }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: vault-local
        resources:
          requests:
            storage: 10Gi
