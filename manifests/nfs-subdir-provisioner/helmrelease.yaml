apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.0.18" # matches the version already live from the original
      # untracked `helm install` (2026-06-02) -- this HelmRelease adopts that
      # existing release by name+namespace rather than installing a second
      # one. Bump deliberately once adopted and verified stable.
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  values:
    nfs:
      path: /mnt/primary_storage/k8s-nfs
      server: 192.168.89.2
    storageClass:
      defaultClass: true
      name: nfs
    # No resources set at all before this (2026-08-21 ipc4 pod-pileup
    # incident) -- was a genuinely untracked ad hoc `helm install`, brought
    # under Flux management in the same pass as adding these.
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
