container-runtime-endpoint: "unix:///run/pelagos/cri.sock"
flannel-backend: none   # Cilium manages CNI; k3s must not run Flannel
kube-proxy-arg:
  - "proxy-mode=nftables"  # IPVS conflicts with Cilium BPF service hooks; nftables does not
disable:
  - local-storage
  - servicelb         # MetalLB owns LoadBalancer services (L2/ARP); see docs/metallb.md
  - network-policy    # Cilium enforces NetworkPolicy; disable k3s built-in controller
# Initialize the embedded-etcd datastore (HA control plane with ipc5/ipc6).
# This member is the cluster-init seed (ipc4); ipc5/ipc6 join as additional servers.
cluster-init: true
# Pin etcd/kubelet to the LAN IPv4 address explicitly. Without this, k3s
# auto-detects the node's primary address, which is non-deterministic on a
# dual-stack interface (LAN IPv4 + SLAAC global IPv6) -- confirmed the hard
# way on ipc6 (2026-08-24): after a physical reboot it auto-selected its
# IPv6 address for etcd's listen-peer/client-urls, leaving no IPv4 listener
# at all, so every other node's "connect to 192.168.88.57:2379" got
# Connection refused and ipc6 spun forever in etcd's raft PreVote phase.
# Injected per-node from scripts/install-pelagos.sh's NODE_IP map.
node-ip: "<NODE_IP>"
# Include the kube-vip control-plane VIP in the apiserver serving cert SAN so
# kubeconfigs can target https://192.168.88.58:6443 (HA endpoint).
tls-san:
  - "192.168.88.58"
  - "k8s-api.home.skeptomai.com"
# NO node-taint: post-migration the control-plane nodes (ipc4-6, i5 Elite Minis)
# are CO-LOCATED and run workloads too. (The old Pentium CP nodes were tainted
# control-plane/slow NoSchedule because they were weak & dedicated; that no longer
# applies.) Re-add a taint here if you ever want dedicated control-plane again.
# node-label persists node-class through a reinstall (k3s applies it at node
# REGISTRATION, like node-taint — a live `kubectl label` is lost on reinstall).
# Servers = the i5-12500T "performance" tier (ipc4-6); workloads select node-class.
node-label:
  - "node-class=performance"
